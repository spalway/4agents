    <link rel="icon" type="image/png" sizes="64x64" href="/brand/favicon-64.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/brand/apple-touch-icon.png" />

    <title>xSTARTUP — four-seat autonomous engineering environment</title>

      name="description"
      content="xSTARTUP operates a four-seat autonomous engineering environment. Four agents share a single host and ship without human review."
    />
